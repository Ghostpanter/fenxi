name: fenxi

services:
  fenxi:
    build: .
    image: fenxi:local
    init: true
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "8080:8080"
      - "127.0.0.1:6080:6080"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PROFILE_DIR: /data/profile
      STATE_DIR: /data/state
    volumes:
      - profile:/data/profile
      - state:/data/state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  profile:
  state:
