name: fenxi

services:
  fenxi:
    build: .
    image: fenxi:local
    init: true
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "8080:8080"
      - "6080:6080"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - ${DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
